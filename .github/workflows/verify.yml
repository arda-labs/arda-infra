name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 1.36.5
      - name: Render Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arda-rendered"
          while IFS=' ' read -r name path; do
            echo "Rendering $path"
            kubectl kustomize "$path" > "$RUNNER_TEMP/arda-rendered/$name.yaml"
          done <<'EOF'
          apps k8s/apps
          network-policies k8s/network-policies
          database database
          monitoring k8s/monitoring
          gateway k8s/gateway
          frontend k8s/frontend
          recovery-overlay overlays/thinkcenter-recovery
          platform-manifests platform/manifests
          EOF
      - name: Install pinned kubeconform
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: Validate rendered Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas "$RUNNER_TEMP/arda-rendered"
      - name: Ensure workload identity mounts are present
        shell: bash
        run: |
          set -euo pipefail
          for service in workflow iam platform finance crm hrm media notification; do
            grep -q "arda-grpc-tls-${service}" k8s/apps/${service}-service.yaml
            grep -q "ARDA_SERVICE_AUTH_SECRET" k8s/apps/${service}-service.yaml
          done
          grep -q "MEDIA_GRPC_ADDR" k8s/apps/iam-service.yaml
          grep -q "MEDIA_GRPC_ADDR" k8s/apps/platform-service.yaml
      - name: Validate secret hygiene
        run: node scripts/check-secret-hygiene.mjs
      - name: Validate workload hardening
        run: node scripts/check-workload-hardening.mjs
      - name: Validate network policy coverage
        run: node scripts/check-network-policy.mjs
      - name: Validate operational gate scripts
        shell: bash
        run: |
          bash -n platform/bootstrap/backup.sh platform/bootstrap/restore.sh platform/bootstrap/preflight.sh platform/bootstrap/verify-runtime-secrets.sh platform/bootstrap/install-cilium.sh
          node scripts/check-operational-gates.mjs
          node scripts/check-canary-policy.mjs
      - run: git diff --check
