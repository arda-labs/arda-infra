apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arda-api
  namespace: arda-app
spec:
  ingressClassName: traefik
  rules:
    - host: arda.io.vn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: auth-gateway
                port:
                  number: 8080
