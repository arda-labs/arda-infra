apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: arda-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: notification-service
          image: ghcr.io/arda-labs/arda-be/notification-service:f6da8d29d8d69623ae5aa10f668636f7f8f6614b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: NOTIFICATION_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "5"
            - name: ZEEBE_ADDR
              value: zeebe-zeebe-gateway.platform.svc.cluster.local:26500
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: NATS_URL
            - name: IAM_GRPC_ADDR
              value: iam-service:9090
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_SUBJECT
              value: mailto:ops@arda.io.vn
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-notification
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: arda-app
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
