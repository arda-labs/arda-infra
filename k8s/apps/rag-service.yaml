apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: rag-service
          image: ghcr.io/arda-labs/arda-be/rag-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8099
          env:
            - name: RAG_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: RAG_DATABASE_DSN
            - name: RAG_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: RAG_EMBEDDING__BASE_URL
              value: https://api.cloudflare.com/client/v4/accounts/8daf04d9f3a2a26d996661b3a67d8710/ai/v1
            - name: RAG_EMBEDDING__API_KEY_ENV
              value: CF_WORKERS_AI_API_TOKEN
            - name: CF_WORKERS_AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_EMBEDDING_API_TOKEN
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: arda-app
spec:
  selector:
    app: rag-service
  ports:
    - name: http
      port: 8099
      targetPort: http