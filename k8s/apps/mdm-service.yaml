apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mdm-service
  template:
    metadata:
      labels:
        app: mdm-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mdm-service
          image: ghcr.io/arda-labs/arda-be/mdm-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: MDM_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "5"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mdm-service
  namespace: arda-app
spec:
  selector:
    app: mdm-service
  ports:
    - name: http
      port: 8080
      targetPort: http
