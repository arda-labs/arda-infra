apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service
  namespace: arda-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: platform-service
  template:
    metadata:
      labels:
        app: platform-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: platform-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/arda-labs/arda-be/platform-service:4d6ac06502846150414f20fab8fee06c379cc77b
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: MEDIA_GRPC_ADDR
              value: media-service:9090
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: PLATFORM_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "5"
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: NATS_URL
                  optional: true
            - name: JOB_TARGET_URLS
              value: ai-service=http://ai-service:8080,platform-service=http://platform-service:8080,loan-service=http://loan-service:8080,deposit-service=http://deposit-service:8080,finance-service=http://finance-service:8080,statistical-service=http://statistical-service:8080
            - name: JOB_NOTIFY_DEFAULT_TENANT
              value: "00000000-0000-0000-0000-000000000010"
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-platform
---
apiVersion: v1
kind: Service
metadata:
  name: platform-service
  namespace: arda-app
spec:
  selector:
    app: platform-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
