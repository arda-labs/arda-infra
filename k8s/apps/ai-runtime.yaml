apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-runtime
  template:
    metadata:
      labels:
        app: ai-runtime
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai-runtime
          image: ghcr.io/arda-labs/arda-be/ai-runtime:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AI_SERVICE_URL
              value: http://ai-service:8080
            - name: COPILOTKIT_TELEMETRY_DISABLED
              value: "true"
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: arda-app
spec:
  selector:
    app: ai-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
