apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistical-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statistical-service
  template:
    metadata:
      labels:
        app: statistical-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: statistical-service
          image: ghcr.io/arda-labs/arda-be/statistical-service:01be3ea491c522475974dcaf0587537133d5cb3e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: STATISTICAL_DATABASE_DSN
            - name: WORKFLOW_GRPC_ADDR
              value: workflow-service:9090
            # Reporting ETL sources (signed /internal/reporting/*). Empty
            # disables that source; all are wired in-cluster.
            - name: LOAN_SERVICE_URL
              value: http://loan-service:8080
            - name: DEPOSIT_SERVICE_URL
              value: http://deposit-service:8080
            - name: CAPITAL_SERVICE_URL
              value: http://capital-service:8080
            - name: CRM_SERVICE_URL
              value: http://crm-service:8080
            - name: FINANCE_SERVICE_URL
              value: http://finance-service:8080
            # PDF rendering of report documents (xlsx/html work without it).
            - name: GOTENBERG_URL
              value: http://gotenberg.platform.svc.cluster.local:3000
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-statistical
---
apiVersion: v1
kind: Service
metadata:
  name: statistical-service
  namespace: arda-app
spec:
  selector:
    app: statistical-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
