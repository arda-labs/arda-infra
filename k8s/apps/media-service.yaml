apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: media-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/arda-labs/arda-be/media-service:4d6ac06502846150414f20fab8fee06c379cc77b
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: LOG_LEVEL
              value: info
            - name: MEDIA_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: MEDIA_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "4"
            - name: DB_MAX_IDLE_CONNS
              value: "2"
            - name: MEDIA_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: NATS_URL
                  optional: true
            - name: GARAGE_ENDPOINT
              value: http://garage.platform.svc.cluster.local:3900
            # Public host used to presign browser-facing GET redirects (files
            # >= 2MB); the internal endpoint stays the data path.
            - name: GARAGE_PUBLIC_ENDPOINT
              value: https://s3.arda.io.vn
            # Office (Word/Excel/PPT) → PDF preview conversion.
            - name: GOTENBERG_URL
              value: http://gotenberg.platform.svc.cluster.local:3000
            - name: GARAGE_REGION
              value: garage
            - name: GARAGE_BUCKET
              value: media
            - name: GARAGE_FORCE_PATH_STYLE
              value: "true"
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: GARAGE_ACCESS_KEY
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: GARAGE_SECRET_KEY
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-media
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: arda-app
spec:
  selector:
    app: media-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
