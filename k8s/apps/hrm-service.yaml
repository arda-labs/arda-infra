apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hrm-service
  template:
    metadata:
      labels:
        app: hrm-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: hrm-service
          image: ghcr.io/arda-labs/arda-be/hrm-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: HRM_DATABASE_DSN
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service.arda-app.svc.cluster.local:8080
            - name: WORKFLOW_GRPC_ADDR
              value: workflow-service:9090
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-hrm
---
apiVersion: v1
kind: Service
metadata:
  name: hrm-service
  namespace: arda-app
spec:
  selector:
    app: hrm-service
  ports:
    - name: http
      port: 8080
      targetPort: http
