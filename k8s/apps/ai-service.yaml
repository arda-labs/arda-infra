apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai-service
          image: ghcr.io/arda-labs/arda-be/ai-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: AI_MODE
              value: production
            - name: AI_ENABLE_READ_TOOLS
              value: "true"
            - name: AI_ENABLE_HITL_PROPOSALS
              value: "true"
            - name: CRM_SERVICE_URL
              value: http://crm-service:8080
            - name: FINANCE_SERVICE_URL
              value: http://finance-service:8080
            - name: HRM_SERVICE_URL
              value: http://hrm-service:8080
            - name: IAM_SERVICE_URL
              value: http://iam-service:8080
            - name: AI_ENABLE_AGENT
              value: "true"
            - name: AI_MODEL_BASE_URL
              value: https://api.b.ai/v1
            - name: AI_MODEL_ID
              value: deepseek-v4-flash
            # Embedding is intentionally explicit. The service accepts an
            # OpenAI-compatible /embeddings endpoint; leaving this unset keeps
            # production ingestion fail-closed until a compatible provider and
            # secret are provisioned.
            - name: AI_RAG_EMBEDDING_BASE_URL
              value: ""
            - name: AI_RAG_EMBEDDING_MODEL
              value: "@cf/qwen/qwen3-embedding-0.6b"
            - name: AI_RAG_EMBEDDING_DIMENSIONS
              value: "1024"
            - name: AI_RAG_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_RAG_EMBEDDING_API_KEY
                  optional: true
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_MAX_IDLE_CONNS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: arda-app
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8080
      targetPort: http
