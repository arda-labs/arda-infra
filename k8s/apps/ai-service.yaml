apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai-service
          image: ghcr.io/arda-labs/arda-be/ai-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: AI_MODE
              value: production
            - name: AI_ENABLE_READ_TOOLS
              value: "true"
            - name: AI_ENABLE_HITL_PROPOSALS
              value: "false"
            - name: CRM_SERVICE_URL
              value: http://crm-service:8080
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_MAX_IDLE_CONNS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: arda-app
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8080
      targetPort: http
