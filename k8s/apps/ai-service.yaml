apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/arda-labs/arda-be/ai-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: AI_MODE
              value: production
            - name: AI_ENABLE_READ_TOOLS
              value: "true"
            - name: AI_ENABLE_HITL_PROPOSALS
              value: "true"
            - name: CRM_SERVICE_URL
              value: http://crm-service:8080
            - name: FINANCE_SERVICE_URL
              value: http://finance-service:8080
            - name: HRM_SERVICE_URL
              value: http://hrm-service:8080
            - name: IAM_SERVICE_URL
              value: http://iam-service:8080
            # Wave-1 AI read tools (WS5). The generated catalog refuses to
            # start in production when a contracted service is unwired.
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service:8080
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8080
            - name: PLATFORM_SERVICE_URL
              value: http://platform-service:8080
            - name: MDM_SERVICE_URL
              value: http://mdm-service:8080
            # Wave-2 AI read tools.
            - name: CAPITAL_SERVICE_URL
              value: http://capital-service:8080
            - name: STATISTICAL_SERVICE_URL
              value: http://statistical-service:8080
            - name: LOAN_SERVICE_URL
              value: http://loan-service:8080
            - name: DEPOSIT_SERVICE_URL
              value: http://deposit-service:8080
            # Public problem-catalog site backing arda.docs.problemLookup.
            # Falls back to https://docs.arda.io.vn in code when unset.
            - name: PROBLEM_DOCS_URL
              value: https://docs.arda.io.vn
            # Chat model is tenant-managed: providers resolve per tenant from
            # ai_tenant_settings (AI Settings UI, keys encrypted at rest with
            # ARDA_SERVICE_AUTH_SECRET). No deployment-level AI_MODEL_* env.
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: NATS_URL
                  optional: true
            # Shared rate-limit window across replicas; falls back to the
            # in-process limiter when Redis is unreachable.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: REDIS_URL
                  optional: true
            # Embedding goes through the Cloudflare AI Gateway universal
            # endpoint (workers-ai provider). The service expects an
            # OpenAI-compatible /embeddings API; the key lives in
            # arda-app-secrets/AI_RAG_EMBEDDING_API_KEY.
            - name: AI_RAG_EMBEDDING_BASE_URL
              value: https://ai-gateway.arda.io.vn/compat
            - name: AI_RAG_EMBEDDING_MODEL
              value: "workers-ai/@cf/qwen/qwen3-embedding-0.6b"
            - name: AI_RAG_EMBEDDING_DIMENSIONS
              value: "1024"
            - name: AI_RAG_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_RAG_EMBEDDING_API_KEY
                  optional: true
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: AI_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_MAX_IDLE_CONNS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: arda-app
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8080
      targetPort: http
