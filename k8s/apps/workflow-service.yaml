apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: workflow-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/arda-labs/arda-be/workflow-service:main
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: WORKFLOW_DATABASE_DSN
            - name: DB_MAX_OPEN_CONNS
              value: "4"
            - name: DB_MAX_IDLE_CONNS
              value: "2"
            - name: ZEEBE_ADDR
              value: zeebe-zeebe-gateway.platform.svc.cluster.local:26500
            - name: ZEEBE_REST_ADDR
              value: http://zeebe-zeebe-gateway.platform.svc.cluster.local:8080
            - name: ZEEBE_ES_URL
              value: http://zeebe-elasticsearch.platform.svc.cluster.local:9200
            - name: CRM_GRPC_ADDR
              value: crm-service:9090
            - name: IAM_GRPC_ADDR
              value: iam-service:9090
            - name: NOTIFICATION_GRPC_ADDR
              value: notification-service:9090
            - name: LOAN_GRPC_ADDR
              value: loan-service:9090
            - name: FINANCE_GRPC_ADDR
              value: finance-service:9090
            - name: HRM_GRPC_ADDR
              value: hrm-service:9090
            - name: DEPOSIT_GRPC_ADDR
              value: deposit-service:9090
            - name: CAPITAL_GRPC_ADDR
              value: capital-service:9090
            - name: STATISTICAL_GRPC_ADDR
              value: statistical-service:9090
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-workflow
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: arda-app
spec:
  selector:
    app: workflow-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
