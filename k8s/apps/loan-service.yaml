apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: arda-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: loan-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: loan-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/arda-labs/arda-be/loan-service:main
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_ADDR
              value: 0.0.0.0:9090
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: LOAN_DATABASE_DSN
            - name: WORKFLOW_GRPC_ADDR
              value: workflow-service:9090
            - name: ARDA_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: arda-app-secrets
                  key: ARDA_SERVICE_AUTH_SECRET
            - name: ARDA_GRPC_CA_FILE
              value: /var/run/arda-grpc-tls/ca.crt
            - name: ARDA_GRPC_CERT_FILE
              value: /var/run/arda-grpc-tls/tls.crt
            - name: ARDA_GRPC_KEY_FILE
              value: /var/run/arda-grpc-tls/tls.key
            - name: DB_MAX_OPEN_CONNS
              value: "10"
            - name: DB_MAX_IDLE_CONNS
              value: "5"
          volumeMounts:
            - name: grpc-tls
              mountPath: /var/run/arda-grpc-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: grpc-tls
          secret:
            secretName: arda-grpc-tls-loan
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: arda-app
spec:
  selector:
    app: loan-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
