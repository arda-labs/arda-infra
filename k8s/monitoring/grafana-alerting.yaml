# Grafana alert rules, provisioned from files. This replaces vmalert: Grafana
# evaluates the rules against the VictoriaMetrics datasource (uid `vm`) and owns
# the alert state visible in Alerting -> Alert rules.
#
# Editing: file provisioning is read when Grafana starts, so either
#   kubectl -n monitoring rollout restart deploy/grafana
# or hot-reload without a restart:
#   POST /api/admin/provisioning/alerting/reload
#
# Notification delivery: rules carry severity/service labels but only show up in
# the Grafana UI until a Telegram contact point exists. To enable Telegram,
# create the contact point in the UI (Alerting -> Contact points, type
# Telegram, bot token + chat id) and set it as the default receiver in
# Alerting -> Notification policies — no manifest change needed. The
# `telegram-alerts` secret in the cluster is what Gatus uses for the same bot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: arda-ai
        folder: Arda
        interval: 1m
        rules:
          - uid: arda-ai-event-publish-failures
            title: ArdaAiEventPublishFailures
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'increase(arda_ai_event_publish_failures_total[15m])'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [0], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: AI events are falling back to the in-memory buffer
              description: '{{ $values.B }} NATS publish failures in the last 15m; the durable stream is not receiving AI events (audit-2026-09 A3).'
            labels:
              severity: warning
              service: ai-service
          - uid: arda-ai-model-unavailable
            title: ArdaAiModelUnavailable
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'increase(arda_ai_model_errors_total{code="ai.model_unavailable"}[15m])'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [0], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 10m
            annotations:
              summary: Tenant AI model is unavailable
              description: '{{ $values.B }} model-unavailable errors in the last 15m.'
            labels:
              severity: warning
              service: ai-service
          - uid: arda-ai-retrieval-embed-slow
            title: ArdaAiRetrievalEmbedSlow
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'histogram_quantile(0.95, sum(rate(arda_ai_retrieval_embed_seconds_bucket[30m])) by (le))'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [5], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: Query embedding p95 above 5s
              description: 'Embedding latency p95 is {{ $values.B }}s over 30m — knowledge searches may hit their deadline.'
            labels:
              severity: warning
              service: ai-service
          - uid: arda-ai-prompt-budget-high
            title: ArdaAiPromptBudgetHigh
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'histogram_quantile(0.95, sum(rate(arda_ai_prompt_bytes_bucket[1h])) by (le))'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [131072], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 30m
            annotations:
              summary: Prompt size p95 above 128 KiB
              description: 'Context growth is approaching the budget; check history compaction (audit-2026-09 A6).'
            labels:
              severity: info
              service: ai-service
      - orgId: 1
        name: arda-endpoints
        folder: Arda
        interval: 1m
        rules:
          - uid: arda-endpoint-down
            title: ArdaEndpointDown
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'count(gatus_results_endpoint_success == 0)'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [0], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 2m
            annotations:
              summary: One or more Arda endpoints are failing their health check
              description: '{{ $values.B }} endpoint(s) failing per Gatus; check the status page and the failing service logs.'
            labels:
              severity: critical
              service: platform
      - orgId: 1
        name: arda-platform
        folder: Arda
        interval: 1m
        rules:
          - uid: arda-pod-crash-looping
            title: ArdaPodCrashLooping
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: 'increase(kube_pod_container_status_restarts_total{namespace=~"arda-app|monitoring"}[15m])'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [3], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: A pod in arda-app/monitoring keeps restarting
              description: '{{ $values.B }} container restarts in 15m — check the pod events and logs (this is how the Grafana OOM/probe flapping would have shown up).'
            labels:
              severity: warning
              service: platform
          - uid: arda-node-disk-filling-up
            title: ArdaNodeDiskFillingUp
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: vm
                model:
                  datasource: { type: prometheus, uid: vm }
                  editorMode: code
                  expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|fuse.*"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|fuse.*"})'
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  reducer: last
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [85], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: A k3s node is above 85% disk usage
              description: '{{ printf "%.1f" $values.B }}% used on the node root filesystem — local-path volumes (Loki, VictoriaMetrics, Grafana) live there.'
            labels:
              severity: warning
              service: platform
      - orgId: 1
        name: arda-workflow
        folder: Arda
        interval: 1m
        rules:
          - uid: arda-workflow-unrouted-decisions
            title: ArdaWorkflowUnroutedDecisions
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  editorMode: code
                  expr: 'sum(count_over_time({app="workflow-service"} |= "no domain adapter for decision" [1h]))'
                  instant: true
                  queryType: instant
                  refId: A
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [0], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 10m
            annotations:
              summary: Decision đã ghi nhận nhưng chưa domain nào xử lý
              description: '{{ $values.B }} decision không có adapter trong 1h — case sẽ kẹt ở nhánh trả lại/submit cho tới khi bổ sung adapter.'
            labels:
              severity: warning
              service: workflow-service
          - uid: arda-workflow-decision-dispatch-failures
            title: ArdaWorkflowDecisionDispatchFailures
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  editorMode: code
                  expr: 'sum(count_over_time({app="workflow-service"} |= "decision dispatcher: apply failed" [1h]))'
                  instant: true
                  queryType: instant
                  refId: A
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [0], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 10m
            annotations:
              summary: Dispatcher không áp được decision sang domain
              description: '{{ $values.B }} lần apply thất bại trong 1h — xem log workflow-service và cột last_error của workflow_task_decisions.'
            labels:
              severity: warning
              service: workflow-service
          - uid: arda-workflow-reconciler-drift
            title: ArdaWorkflowReconcilerDrift
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: loki
                model:
                  datasource: { type: loki, uid: loki }
                  editorMode: code
                  expr: 'sum(count_over_time({app="workflow-service"} |= "workflow reconciler closed stale task" [1h]))'
                  instant: true
                  queryType: instant
                  refId: A
              - refId: B
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [], type: gt }
                      operator: { type: and }
                      query: { params: [B] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: reduce
                  settings: { mode: dropNN }
              - refId: C
                relativeTimeRange: { from: 3600, to: 0 }
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator: { params: [5], type: gt }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { params: [], type: last }
                      type: query
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: B
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: threshold
                  settings: {}
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: Reconciler liên tục đóng task cũ (lệch engine ↔ DB)
              description: '{{ $values.B }} task bị đóng do engine đã kết thúc trong 1h — dấu hiệu complete-write thất bại lặp lại; kiểm tra log workflow-service.'
            labels:
              severity: warning
              service: workflow-service
