# VictoriaMetrics single-node (audit-2026-09 A3): scrapes every Arda service
# /metrics endpoint (all 15 services expose arda_http_* there) plus the
# monitoring stack itself, and keeps 30 days of history. Alert evaluation lives
# in Grafana now (k8s/monitoring/grafana-alerting.yaml) — vmalert was retired so
# there is a single UI for dashboards, alert state and notifications.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: arda-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - ai-service.arda-app.svc.cluster.local:8080
              - auth-gateway.arda-app.svc.cluster.local:8080
              - capital-service.arda-app.svc.cluster.local:8080
              - crm-service.arda-app.svc.cluster.local:8080
              - deposit-service.arda-app.svc.cluster.local:8080
              - finance-service.arda-app.svc.cluster.local:8080
              - hrm-service.arda-app.svc.cluster.local:8080
              - iam-service.arda-app.svc.cluster.local:8080
              - loan-service.arda-app.svc.cluster.local:8080
              - mdm-service.arda-app.svc.cluster.local:8080
              - media-service.arda-app.svc.cluster.local:8080
              - notification-service.arda-app.svc.cluster.local:8080
              - platform-service.arda-app.svc.cluster.local:8080
              - statistical-service.arda-app.svc.cluster.local:8080
              - workflow-service.arda-app.svc.cluster.local:8080
            labels:
              cluster: arda
      # The monitoring stack supervises itself too: VictoriaMetrics, Grafana,
      # Loki and Gatus own metrics are scraped as well.
      - job_name: monitoring
        metrics_path: /metrics
        static_configs:
          - targets:
              - vmsingle.monitoring.svc.cluster.local:8428
              - grafana.monitoring.svc.cluster.local:3000
              - loki.monitoring.svc.cluster.local:3100
              - gatus.monitoring.svc.cluster.local:8080
            labels:
              cluster: arda
      # Node resources (DaemonSet on hostPort 9100, scraped over the node LAN).
      - job_name: node-exporter
        metrics_path: /metrics
        static_configs:
          - targets:
              - 192.168.10.201:9100
              - 192.168.10.202:9100
              - 192.168.10.203:9100
            labels:
              cluster: arda
      # Workload state: pod phases, restarts, OOM reasons, deployment health.
      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080
            labels:
              cluster: arda
      # Per-pod resource usage from the kubelet cAdvisor endpoint. The raw dump
      # is huge, so only the series the Kubernetes dashboard uses are kept.
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets:
              - 192.168.10.201:10250
              - 192.168.10.202:10250
              - 192.168.10.203:10250
            labels:
              cluster: arda
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_fs_usage_bytes|machine_cpu_cores|machine_memory_bytes
            action: keep
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmsingle-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vmsingle
  template:
    metadata:
      labels:
        app: vmsingle
    spec:
      serviceAccountName: vmsingle
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.152.0
          args:
            - -storageDataPath=/vm-data
            - -retentionPeriod=30d
            - -promscrape.config=/etc/vm/scrape.yml
            - -httpListenAddr=:8428
            - -vmui.customDashboardsPath=/etc/vmui-dashboards
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: scrape
              mountPath: /etc/vm
            - name: vmui-dashboards
              mountPath: /etc/vmui-dashboards
            - name: data
              mountPath: /vm-data
      volumes:
        - name: scrape
          configMap:
            name: vmsingle-scrape
        - name: vmui-dashboards
          configMap:
            name: vmui-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: vmsingle-data
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  selector:
    app: vmsingle
  ports:
    - name: http
      port: 8428
      targetPort: http
