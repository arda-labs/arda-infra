namespace: monitoring

resources:
  - victoria-metrics.yaml
  - monitoring-ingress.yaml
  - grafana.yaml

# Dashboard JSON lives as real files next to the manifests and is turned into
# ConfigMaps here so both UIs can mount them read-only. The namespace field
# above is what pins the generated ConfigMaps to `monitoring` (a generator in
# the root kustomization would land them in the Argo destination namespace).
configMapGenerator:
  - name: vmui-dashboards
    files:
      - dashboards/arda-overview.json
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards
    files:
      - dashboards/grafana-arda-overview.json
    options:
      disableNameSuffixHash: true
