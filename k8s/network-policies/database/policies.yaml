# Database tier. CloudNativePG keeps three Postgres instances here; before
# Cilium this namespace had no policy at all, so any pod in the cluster could
# open a connection with any credential it happened to hold — or, for a role
# with a guessable or leaked password, simply try one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Applications and Ory authentication use their own database roles.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-arda-app
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arda-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
      ports:
        - protocol: TCP
          port: 5432
---
# Certificate distribution and health probes. The CNPG controller is deployed
# outside this repository, so the grant is scoped to the operator namespace
# rather than to a pod label this repo does not own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-operator
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
# Replicas stream WAL from the primary and instance managers watch the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replication
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 192.168.10.201/32
      ports:
        - protocol: TCP
          port: 6443
---
# Developer workstation reaching the primary through the LAN VIP
# (database/loadbalancer, 192.168.10.210:5432). The grant is one /32, not the LAN: every
# other device on 192.168.10.0/24 stays denied. It only matches because that
# Service uses externalTrafficPolicy: Local; with Cluster, kube-proxy
# masquerades the client to a node address and this ipBlock never sees it.
# Keep the address pinned with a DHCP reservation, or update it here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-dev-workstation
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.10.41/32
      ports:
        - protocol: TCP
          port: 5432
---
# Tailscale subnet router (Proxmox LXC 120 "ts-router", 192.168.10.220) for
# remote/cloud agents. The router SNATs tailnet traffic, so a cloud client
# reaches the primary through the LAN VIP as 192.168.10.220. One /32, same
# reasoning as allow-ingress-from-dev-workstation. Who may use the tunnel is
# decided by the Tailscale ACL (tag:cloud -> 192.168.10.210:5432 and
# 192.168.10.201:6443 only); the database role they connect with is read-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-tailscale-router
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.10.220/32
      ports:
        - protocol: TCP
          port: 5432
