# Database tier. CloudNativePG keeps three Postgres instances here; before
# Cilium this namespace had no policy at all, so any pod in the cluster could
# open a connection with any credential it happened to hold — or, for a role
# with a guessable or leaked password, simply try one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Postgres is reachable only from the application tier. The CNPG operator runs
# in its own namespace and reaches the instances through loopback inside the pod,
# so it does not need this grant.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-arda-app
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arda-app
      ports:
        - protocol: TCP
          port: 5432
---
# The AiGiare gateway runs on its own database and role (see
# k8s/bootstrap-gateway-database.sh), so it is granted access by namespace
# rather than by sharing a credential with the banking tier. The grant is
# namespace-wide rather than label-scoped because the gateway Deployment
# declares no label this repo's policy checker can resolve against.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-aigiare-gw
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aigiare-gw
      ports:
        - protocol: TCP
          port: 5432
---
# Certificate distribution and health probes. The CNPG controller is deployed
# outside this repository, so the grant is scoped to the operator namespace
# rather than to a pod label this repo does not own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-operator
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8008
