apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arda-web
  namespace: arda-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: arda-web-arda-web-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: arda.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
