apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: arda-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/arda-labs/arda-fe/web:ea34fefd9f81abd07307e988a028adf83cb9a974
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "5000"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=96"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: arda-web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 5000
      targetPort: http
