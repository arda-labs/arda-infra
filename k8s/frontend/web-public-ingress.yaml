apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arda-web-public
  namespace: arda-web
spec:
  ingressClassName: traefik
  rules:
    - host: arda.io.vn
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /callback
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /login-callback
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /consent
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /mfes
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5000
          - path: /vite.svg
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 5000
