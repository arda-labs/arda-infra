# TEMPLATE ONLY — not referenced by kustomization.yaml, so Argo CD never
# applies it. The live Secret is cluster-local and must be created out of band:
#
#   kubectl create secret generic aigiare-gw-secrets -n aigiare-gw \
#     --from-literal=SQL_DSN='<role>:<password>@pg-main-rw.database.svc.cluster.local:5432/<database>?sslmode=disable' \
#     --from-literal=REDIS_CONN_STRING='redis://:<valkey-password>@valkey-master.platform.svc.cluster.local:6379/3' \
#     --from-literal=SESSION_SECRET='<random-32-bytes-hex>' \
#     --from-literal=CRYPTO_SECRET='<random-32-bytes-hex>'
#
# Generate the two secrets with:
#
#   openssl rand -hex 32
#
# Notes on each value:
#
#   SQL_DSN
#     sslmode=disable is correct: the CNPG service name only resolves inside
#     the cluster, so there is no TLS to negotiate. Create the role and
#     database with k8s/bootstrap-gateway-database.sh first. This role must be
#     LOGIN only, never superuser — new-api runs GORM AutoMigrate on boot and
#     must not be able to create extensions or roles.
#
#   REDIS_CONN_STRING
#     Points at valkey-master, NOT at Sentinel. new-api accepts a single
#     REDIS_CONN_STRING URL and has no Sentinel-aware client, so a URL like the
#     redis-sentinel:// one the Arda apps use is not supported here. The
#     consequence is that a Valkey primary failover will break this connection
#     until the pod is restarted. Acceptable for a single replica; revisit if
#     the gateway ever runs more than one.
#
#     Database index 3 is deliberate. new-api writes quota, rate-limit and
#     session keys into whichever index it is given; sharing an index with
#     another application risks key collisions.
apiVersion: v1
kind: Secret
metadata:
  name: aigiare-gw-secrets
  namespace: aigiare-gw
type: Opaque
stringData:
  SQL_DSN: "<role>:<password>@pg-main-rw.database.svc.cluster.local:5432/<database>?sslmode=disable"
  REDIS_CONN_STRING: "redis://:<valkey-password>@valkey-master.platform.svc.cluster.local:6379/3"
  SESSION_SECRET: "<random-32-bytes-hex>"
  CRYPTO_SECRET: "<random-32-bytes-hex>"
