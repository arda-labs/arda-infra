# TEMPLATE ONLY — not referenced by kustomization.yaml, so Argo CD never
# applies it. The live Secret is cluster-local and must be created out of band:
#
#   kubectl create secret generic aigiare-gw-secrets -n aigiare-gw \
#     --from-literal=SQL_DSN='<role>:<password>@pg-main-rw.database.svc.cluster.local:5432/<database>?sslmode=disable' \
#     --from-literal=REDIS_CONN_STRING='redis://:<valkey-password>@aigiare-gw-valkey.aigiare-gw.svc.cluster.local:6379/0' \
#     --from-literal=VALKEY_PASSWORD='<valkey-password>' \
#     --from-literal=SESSION_SECRET='<random-32-bytes-hex>' \
#     --from-literal=CRYPTO_SECRET='<random-32-bytes-hex>'
#
# Generate the three secrets with:
#
#   openssl rand -hex 32
#
# Notes on each value:
#
#   SQL_DSN
#     sslmode=disable is correct: the CNPG service name only resolves inside
#     the cluster, so there is no TLS to negotiate. Create the role and
#     database with k8s/bootstrap-gateway-database.sh first. This role must be
#     LOGIN only, never superuser — new-api runs GORM AutoMigrate on boot and
#     must not be able to create extensions or roles.
#
#   REDIS_CONN_STRING
#     Points at the namespace-local single-node Valkey in
#     k8s/gateway/valkey.yaml, NOT at the platform Valkey. The platform Service
#     named `valkey` load-balances across all three pods including replicas, so
#     a write through it returns READONLY most of the time; new-api has no
#     Sentinel support to route around that. Database index 0 is safe here
#     because this Valkey serves only this gateway.
#
#   VALKEY_PASSWORD
#     Must match the password in REDIS_CONN_STRING. It is the same value in two
#     places because the StatefulSet reads it as an env var to build its
#     --requirepass flag while new-api needs it inside the connection URL.
apiVersion: v1
kind: Secret
metadata:
  name: aigiare-gw-secrets
  namespace: aigiare-gw
type: Opaque
stringData:
  SQL_DSN: "<role>:<password>@pg-main-rw.database.svc.cluster.local:5432/<database>?sslmode=disable"
  REDIS_CONN_STRING: "redis://:<valkey-password>@aigiare-gw-valkey.aigiare-gw.svc.cluster.local:6379/0"
  VALKEY_PASSWORD: "<valkey-password>"
  SESSION_SECRET: "<random-32-bytes-hex>"
  CRYPTO_SECRET: "<random-32-bytes-hex>"
