# AiGiare API gateway (new-api) — runs in its own namespace.
#
# This is an internet-facing, third-party (AGPL) service that holds customer
# balances and API keys. It is deliberately NOT in `arda-app`: the banking
# tier is default-deny and grants each traffic edge explicitly, and this
# workload has a completely different trust profile — public ingress, no
# caller auth of its own beyond what new-api implements, and egress to
# arbitrary upstream hosts. See ../../k8s/network-policies/aigiare-gw/policies.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aigiare-gateway
  namespace: aigiare-gw
  labels:
    app: aigiare-gateway
spec:
  # Single replica on purpose. new-api keeps quota and channel state in
  # PostgreSQL, but session and rate-limit state is also held in Valkey and in
  # process memory; scaling out is only safe once a second replica and a
  # canary observation exist. platform/policy/canary-policy-v1.json requires a
  # rollout to start at exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aigiare-gateway
  template:
    metadata:
      labels:
        app: aigiare-gateway
    spec:
      automountServiceAccountToken: false
      # Numeric UID only — the upstream image ships no /etc/passwd entry for
      # 10001, which is fine because a Go binary does not need one.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the emptyDir volumes group-writable so the non-root UID can
        # write /data. Required because the upstream Dockerfile creates no
        # user and the image would otherwise be unwritable under runAsNonRoot.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # No imagePullSecrets: this is a public Docker Hub image, so the
      # namespace-scoped ghcr-pull secret the other workloads use is neither
      # needed nor correct here.
      containers:
        - name: new-api
          securityContext:
            allowPrivilegeEscalation: false
            # Cannot be true here. The upstream image sets WORKDIR /data and
            # writes application logs plus (when SQL_DSN is unset) the SQLite
            # database there. This workload is the one documented exception to
            # the readOnlyRootFilesystem rule the rest of the cluster follows.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # Upstream release image, used unmodified. Nothing in this deployment
          # patches new-api, so there is nothing to build and no fork to
          # maintain. Pinned to a numbered release rather than `latest`; Argo CD
          # Image Updater resolves the tag to a digest and writes it back, which
          # is what platform/policy/canary-policy-v1.json requires
          # (immutable-digest-or-commit-sha).
          #
          # To change version, update this tag and the matching imageName in
          # argocd/image-updater.yaml in the same commit.
          image: calciumion/new-api:v1.0.0-rc.40
          imagePullPolicy: IfNotPresent
          args:
            - --log-dir
            - /data/logs
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # First boot runs GORM AutoMigrate against PostgreSQL before the
          # listener answers, so the startup probe is generous.
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            failureThreshold: 60
            periodSeconds: 5
          # Readiness is the DB-aware endpoint: new-api must not take traffic
          # until it can read its own settings and quota tables.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness is a TCP check on purpose. /api/status reads the database,
          # and a liveness probe on a DB-backed endpoint turns a brief
          # PostgreSQL blip into a restart loop on the only replica.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: PORT
              value: "3000"
            - name: TZ
              value: Asia/Ho_Chi_Minh
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: aigiare-gw-secrets
                  key: SQL_DSN
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: aigiare-gw-secrets
                  key: REDIS_CONN_STRING
            # Signing/encryption key for browser sessions. Without it new-api
            # generates a random value on every start, which silently logs
            # every user out on each restart.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: aigiare-gw-secrets
                  key: SESSION_SECRET
            # HMAC key for cache keys. Defaults to SESSION_SECRET, which is
            # acceptable only while this is the single node sharing Valkey.
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: aigiare-gw-secrets
                  key: CRYPTO_SECRET
            # pg-main runs max_connections=300 and is shared by the banking tier.
            # new-api defaults to 1000 open connections, which would exhaust the
            # cluster and take Arda down with it.
            - name: SQL_MAX_OPEN_CONNS
              value: "25"
            - name: SQL_MAX_IDLE_CONNS
              value: "10"
            # Claude Code streams routinely exceed the 120s default silence
            # window; an expired stream looks to the client like a dropped answer.
            - name: STREAMING_TIMEOUT
              value: "300"
            - name: RELAY_IDLE_CONN_TIMEOUT
              value: "90"
            - name: ERROR_LOG_ENABLED
              value: "true"
            - name: BATCH_UPDATE_ENABLED
              value: "true"
            # Single replica, so an in-process cache is a valid first tier and
            # keeps quota lookups serving if Valkey is briefly unreachable.
            - name: MEMORY_CACHE_ENABLED
              value: "true"
            - name: NODE_NAME
              value: aigiare-gateway-1
            - name: FRONTEND_BASE_URL
              value: https://aigiare.com
            # Left unset on purpose. Unset trusts loopback + RFC 1918, which
            # covers the cloudflared pod network (10.42.0.0/16) so Cloudflare's
            # X-Forwarded-For chain resolves to the real client IP and per-IP
            # rate limiting works. Setting this to a narrower CIDR that misses
            # cloudflared would collapse every client onto one IP, which
            # disables abuse limiting entirely. Tighten only after confirming
            # the live pod CIDR.
            - name: TRUSTED_PROXIES
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # PostgreSQL is the source of truth for users, channels, tokens and
        # quota, so nothing durable belongs here. An emptyDir keeps logs off the
        # node filesystem; Alloy ships container stdout to Loki, and this
        # directory only holds the --log-dir file copy.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aigiare-gateway
  namespace: aigiare-gw
  labels:
    app: aigiare-gateway
spec:
  selector:
    app: aigiare-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
