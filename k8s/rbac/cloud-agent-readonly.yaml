# Read-only identity for remote/cloud agents that reach the cluster through the
# Tailscale subnet router (see network-policies/database allow-ingress-from-
# tailscale-router). It gets the built-in `view` ClusterRole (no Secrets, no
# RBAC objects, no pods/exec or port-forward) plus read access to nodes, CNPG
# clusters and Argo CD Applications. No create/update/delete anywhere.
#
# Build a kubeconfig from the token Secret below; never commit the token:
#   scripts/make-cloud-kubeconfig.ps1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-agent-readonly
  namespace: arda-app
---
# Long-lived token for the ServiceAccount, filled in by the token controller.
# Rotate by deleting this Secret; Argo CD recreates it with a new token.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-agent-readonly-token
  namespace: arda-app
  annotations:
    kubernetes.io/service-account.name: cloud-agent-readonly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-agent-readonly-extra
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-agent-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: cloud-agent-readonly
    namespace: arda-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-agent-readonly-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-agent-readonly-extra
subjects:
  - kind: ServiceAccount
    name: cloud-agent-readonly
    namespace: arda-app
