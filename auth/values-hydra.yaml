replicaCount: 1

namespace: auth

hydra:
  automigration:
    enabled: true

  dangerousForceHttp: true

  config:
    dsn: ""

    urls:
      self:
        issuer: https://auth.arda.io.vn/
      login: https://api.arda.io.vn/api/auth/login
      consent: https://api.arda.io.vn/api/auth/consent
      logout: https://arda.io.vn/logout

    secrets:
      system:
        []
      cookie:
        []

ingress:
  public:
    enabled: true
    className: traefik
    hosts:
      - host: auth.arda.io.vn
        paths:
          - path: /
            pathType: Prefix

  admin:
    enabled: false

maester:
  enabled: false
