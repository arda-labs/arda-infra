# R2 API token for the pg-main backup bucket (database/backup-objectstore.yaml).
# Scope the token to the arda-pg-backups bucket only, Object Read & Write.
# Create it by hand (docs/postgres-backup-restore.md §1); never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: r2-pg-backup
  namespace: database
type: Opaque
stringData:
  R2_ACCESS_KEY_ID: "REPLACE_WITH_R2_ACCESS_KEY_ID"
  R2_SECRET_ACCESS_KEY: "REPLACE_WITH_R2_SECRET_ACCESS_KEY"
