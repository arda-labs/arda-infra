apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage-webui
  template:
    metadata:
      labels:
        app: garage-webui
    spec:
      containers:
        - name: garage-webui
          image: khairul169/garage-webui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3909
          env:
            - name: API_BASE_URL
              value: "http://garage-admin:3903"
            - name: S3_ENDPOINT_URL
              value: "http://garage:3900"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-webui-secret
                  key: GARAGE_ADMIN_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app: garage-webui
  ports:
    - name: http
      port: 3909
      targetPort: 3909
