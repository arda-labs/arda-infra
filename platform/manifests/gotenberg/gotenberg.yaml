# Gotenberg 8 — stateless conversion service (MIT, gotenberg/gotenberg).
# Renders HTML→PDF (Chromium) and Office→PDF (LibreOffice) for the document
# pipeline in arda-be libs/go/arda-doc. Image bundles Noto fonts, so
# Vietnamese diacritics render correctly out of the box. ClusterIP only:
# in-cluster consumers only, no ingress, no secrets needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: platform
  labels:
    app: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.36.0
          # LibreOffice serializes conversions behind an internal lock; a
          # 120s API timeout covers statement-sized documents without
          # wedging Chromium requests.
          args:
            - gotenberg
            - --api-timeout=120s
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            # Legacy/VN Office documents often name fonts that are not
            # installed (e.g. "Times New Roman Bold" as a family). Without an
            # alias fontconfig falls back to Noto Sans, whose metrics differ
            # from the serif original and push content across pages.
            - name: font-aliases
              mountPath: /etc/fonts/conf.d/99-arda-font-aliases.conf
              subPath: 99-arda-font-aliases.conf
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: font-aliases
          configMap:
            name: gotenberg-font-aliases
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gotenberg-font-aliases
  namespace: platform
data:
  99-arda-font-aliases.conf: |
    <?xml version="1.0"?>
    <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
    <fontconfig>
      <!-- Legacy Vietnamese templates frequently name these families, which
           are not installed (MS fonts are not redistributable). Map them to
           the metric-compatible substitutes shipped with Gotenberg so
           paragraph and table layout matches the original document. -->
      <match target="pattern">
        <test name="family"><string>Times New Roman Bold</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
        <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
      </match>
      <match target="pattern">
        <test name="family"><string>Tahoma</string></test>
        <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
      </match>
      <match target="pattern">
        <test name="family"><string>Verdana</string></test>
        <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
      </match>
      <match target="pattern">
        <test name="family"><string>.VnTime</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
      </match>
      <match target="pattern">
        <test name="family"><string>.VnArial</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
      </match>
      <match target="pattern">
        <test name="family"><string>ITCCentury Book</string></test>
        <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
      </match>
    </fontconfig>
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: platform
  labels:
    app: gotenberg
spec:
  type: ClusterIP
  selector:
    app: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
