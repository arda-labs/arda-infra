apiVersion: v1
kind: Service
metadata:
  name: valkey-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      nodePort: 30379

    - name: sentinel
      port: 26379
      targetPort: 26379
      nodePort: 30380