apiVersion: v1
kind: Service
metadata:
  name: zeebe-gateway-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app: camunda-platform
    app.kubernetes.io/component: zeebe-gateway
    app.kubernetes.io/instance: zeebe
  ports:
    - name: grpc
      port: 26500
      targetPort: 26500
      nodePort: 30650
    - name: rest
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: metrics
      port: 9600
      targetPort: 9600
      nodePort: 30960
