apiVersion: v1
kind: Service
metadata:
  name: nats-nodeport
  namespace: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: nats
    app.kubernetes.io/name: nats
  ports:
    - name: nats
      protocol: TCP
      port: 4222
      targetPort: nats
      nodePort: 30222
