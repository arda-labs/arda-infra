global:
  elasticsearch:
    enabled: true
    disableExporter: false
  identity:
    auth:
      enabled: false

identity:
  enabled: false

identityKeycloak:
  enabled: false

operate:
  enabled: false

tasklist:
  enabled: false

optimize:
  enabled: false

connectors:
  enabled: false

webModeler:
  enabled: false

elasticsearch:
  enabled: true
  # Bitnami subchart: master.replicaCount (không phải replicas).
  # Pilot 1 node: bắt buộc masterOnly: false — nếu không cluster báo data_nodes=0, shard UNASSIGNED.
  master:
    masterOnly: false
    replicaCount: 1
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

zeebe:
  enabled: true
  clusterSize: 1
  partitionCount: 1
  replicationFactor: 1
  pvcSize: 8Gi
  pvcStorageClassName: local-path
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

zeebeGateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
