# Zeebe/Camunda Platform chart values.
# Disabled by default from config/platform.env.
#
# Warning:
# Camunda Platform chart 10.x may require secondary storage.
# Review carefully before enabling INSTALL_ZEEBE=true.

global:
  identity:
    auth:
      enabled: false

identity:
  enabled: false

identityKeycloak:
  enabled: false

operate:
  enabled: false

tasklist:
  enabled: false

optimize:
  enabled: false

connectors:
  enabled: false

webModeler:
  enabled: false

elasticsearch:
  enabled: false

zeebe:
  enabled: true
  clusterSize: 1
  partitionCount: 1
  replicationFactor: 1
  pvcSize: 8Gi
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

zeebeGateway:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
