# Values for the official Garage chart at garage/script/helm/garage.

garage:
  replicationFactor: "3"
  s3:
    api:
      region: garage
      rootDomain: ".s3.arda.io.vn"
    web:
      rootDomain: ".web.arda.io.vn"

deployment:
  replicaCount: 3

persistence:
  enabled: true
  meta:
    storageClass: local-path
    size: 1Gi
  data:
    storageClass: local-path
    size: 5Gi

service:
  type: ClusterIP
