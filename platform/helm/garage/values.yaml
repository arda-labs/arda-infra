# Best-effort values for Garage Helm chart.
# If your old Garage chart is local, put it under charts/garage.
# install-garage.sh will prefer repo chart garage/garage, then ./charts/garage.

replicaCount: 3

garage:
  replicationMode: "3"

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi

service:
  type: ClusterIP
