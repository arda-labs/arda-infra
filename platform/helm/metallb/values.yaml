# MetalLB in L2 (ARP) mode only, for LAN VIPs on Services that opt in.
#
# loadBalancerClass keeps MetalLB away from Services without a class (Traefik),
# which k3s ServiceLB keeps serving; ServiceLB in turn skips any Service that
# sets a class, so the two never claim the same Service.
loadBalancerClass: metallb.io/l2

# No BGP peer on this network: drop the FRR backends.
frrk8s:
  enabled: false

speaker:
  frr:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

controller:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
