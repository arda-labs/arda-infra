apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-main-backup
  namespace: database
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://arda-postgres-backups/
    endpointURL: http://garage.platform.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: pg-main-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pg-main-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
