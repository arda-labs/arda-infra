apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: database
spec:
  instances: 3
  enableSuperuserAccess: true

  imageName: ghcr.io/cloudnative-pg/postgresql:18.0

  storage:
    storageClass: local-path
    size: 10Gi

  # Continuous WAL archiving + base backups to Cloudflare R2 through the
  # Barman Cloud plugin (backup-objectstore.yaml, backup-schedule.yaml).
  # The r2-pg-backup Secret and the bucket must exist first:
  # docs/postgres-backup-restore.md §1.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-main-r2

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: false

  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "8MB"
      maintenance_work_mem: "256MB"
      max_wal_size: "4GB"
      checkpoint_timeout: "15min"
