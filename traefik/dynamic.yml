http:
  middlewares:
    arda-forward-auth:
      forwardAuth:
        address: "http://auth-gateway:8080/auth/check"
        # Do not trust client-supplied X-Forwarded-Uri/Method: the gateway picks
        # the policy route from those headers, so Traefik must generate them.
        trustForwardHeader: false
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Subject"
          - "X-Username"
          - "X-User-Email"
          - "X-Tenant-Id"
          - "X-User-Org-Ids"
          - "X-User-Group-Ids"
          - "X-Roles"
          - "X-Permissions"
          - "X-Global-Roles"
          - "X-Global-Permissions"
          - "X-Global-Admin"
          - "X-Auth-Version"
          - "X-Auth-Risk"
          - "X-Auth-Checked"

  routers:
    iam-public:
      rule: "PathPrefix(`/api/iam/public`)"
      service: iam-service
      entryPoints:
        - web

    iam-api:
      rule: "PathPrefix(`/api/iam`)"
      service: iam-service
      entryPoints:
        - web
      middlewares:
        - arda-forward-auth

    mdm-api:
      rule: "PathPrefix(`/api/mdm`)"
      service: mdm-service
      entryPoints:
        - web
      middlewares:
        - arda-forward-auth

    platform-public:
      rule: "PathPrefix(`/api/platform/public`)"
      service: platform-service
      entryPoints:
        - web

    platform-api:
      rule: "PathPrefix(`/api/platform`)"
      service: platform-service
      entryPoints:
        - web
      middlewares:
        - arda-forward-auth

    workflow-api:
      rule: "PathPrefix(`/api/workflow`)"
      service: workflow-service
      entryPoints:
        - web
      middlewares:
        - arda-forward-auth

  services:
    iam-service:
      loadBalancer:
        servers:
          - url: "http://iam-service:8080"

    mdm-service:
      loadBalancer:
        servers:
          - url: "http://mdm-service:8080"

    platform-service:
      loadBalancer:
        servers:
          - url: "http://platform-service:8080"

    workflow-service:
      loadBalancer:
        servers:
          - url: "http://workflow-service:8080"
