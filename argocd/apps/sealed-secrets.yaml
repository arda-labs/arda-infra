# Sealed Secrets controller: decrypts SealedSecret objects committed to Git
# into ordinary Secrets inside the cluster. Only this controller holds the
# private key, so an encrypted manifest in Git is useless anywhere else.
#
# The private key is the one thing Git cannot rebuild: back it up off-cluster
# right after the first sync (docs/secret-management.md §2), or every sealed
# manifest becomes unreadable the day the cluster is lost.
#
# Name and namespace are the kubeseal defaults (sealed-secrets-controller in
# kube-system), so `kubeseal` needs no --controller-* flags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0 # controller v0.41.2
    helm:
      releaseName: sealed-secrets-controller
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
