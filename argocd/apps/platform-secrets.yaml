apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: arda
  source:
    repoURL: https://github.com/arda-labs/arda-infra.git
    targetRevision: main
    path: platform/secrets/sops
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
