apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arda-frontend
  namespace: argocd
spec:
  project: arda
  source:
    repoURL: https://github.com/arda-labs/arda-infra.git
    targetRevision: main
    path: k8s/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: arda-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
