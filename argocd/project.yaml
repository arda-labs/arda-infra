apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arda
  namespace: argocd
spec:
  description: Arda applications
  sourceRepos:
    - https://github.com/arda-labs/arda-infra.git
  destinations:
    - namespace: database
      server: https://kubernetes.default.svc
    - namespace: arda-app
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # Needed by the monitoring stack: Alloy log shipping, kube-state-metrics
    # and the vmsingle kubelet scrape all use cluster-scoped RBAC.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
