apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arda
  namespace: argocd
spec:
  description: Arda applications
  sourceRepos:
    - https://github.com/arda-labs/arda-infra.git
    - https://charts.jetstack.io
    - https://cloudnative-pg.github.io/charts
  destinations:
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: cnpg-system
      server: https://kubernetes.default.svc
    - namespace: database
      server: https://kubernetes.default.svc
    - namespace: arda-app
      server: https://kubernetes.default.svc
    - namespace: arda-web
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: platform
      server: https://kubernetes.default.svc
    # Public-facing AiGiare gateway. Listed explicitly because the AppProject
    # destination list is an allowlist: without this, Argo CD refuses to place
    # the k8s/gateway resources even though the repository is permitted.
    - namespace: aigiare-gw
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # cert-manager and the CNPG backup plugin own their controller CRDs,
    # webhook configurations and cluster-scoped RBAC.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # Needed by the monitoring stack: Alloy log shipping, kube-state-metrics
    # and the vmsingle kubelet scrape all use cluster-scoped RBAC.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
