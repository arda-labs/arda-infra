apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: arda
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: arda-backend
      images:
        - alias: authgateway
          imageName: ghcr.io/arda-labs/arda-be/auth-gateway:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: iamservice
          imageName: ghcr.io/arda-labs/arda-be/iam-service:92b4c1574893c9acbc819cbb4bba13a46dd85be1
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: platformservice
          imageName: ghcr.io/arda-labs/arda-be/platform-service:92b4c1574893c9acbc819cbb4bba13a46dd85be1
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: financeservice
          imageName: ghcr.io/arda-labs/arda-be/finance-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: mediaservice
          imageName: ghcr.io/arda-labs/arda-be/media-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: workflowservice
          imageName: ghcr.io/arda-labs/arda-be/workflow-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: crmservice
          imageName: ghcr.io/arda-labs/arda-be/crm-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: hrmservice
          imageName: ghcr.io/arda-labs/arda-be/hrm-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: notificationservice
          imageName: ghcr.io/arda-labs/arda-be/notification-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: aiservice
          imageName: ghcr.io/arda-labs/arda-be/ai-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: loanservice
          imageName: ghcr.io/arda-labs/arda-be/loan-service:cf3a92bc0b02a5781e953efb83093ef3e8f20a27
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: mdmservice
          imageName: ghcr.io/arda-labs/arda-be/mdm-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: depositservice
          imageName: ghcr.io/arda-labs/arda-be/deposit-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: capitalservice
          imageName: ghcr.io/arda-labs/arda-be/capital-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: statisticalservice
          imageName: ghcr.io/arda-labs/arda-be/statistical-service:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
        - alias: aigiaregateway
          imageName: calciumion/new-api:v1.0.0-rc.40
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: arda-frontend
      images:
        - alias: web
          imageName: ghcr.io/arda-labs/arda-mfe/web:main
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull
