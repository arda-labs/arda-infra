apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmp-ksops
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-ksops
    spec:
      version: v1
      generate:
        command: [sh, -c]
        args:
          - set -eu; kustomize build --enable-alpha-plugins --enable-exec .
      discover:
        find:
          command: [sh, -c, "find . -name ksops-generator.yaml -type f -print -quit | grep -q ."]
